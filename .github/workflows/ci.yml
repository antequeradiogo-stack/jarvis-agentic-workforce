name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (network-blocked; falls back to the socket guard if user namespaces are restricted)
        run: ./scripts/test.sh -v
      - name: Demo smoke run
        run: ./scripts/demo.sh --scenario approve
